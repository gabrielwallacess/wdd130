<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
content="Entre em contato com a Rio Abaixo Rafting para dúvidas, reservas e sugestões. Atendimento rápido e suporte completo para sua aventura." />
    <meta name="author" content="Gabriel Wallace Soares Dos Santos">

    <title>Fale Conosco | Rio Abaixo Rafting</title>

    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>

    <header>

        <img src="imagens/logo.png" alt="Logo Rio Abaixo Rafting">

        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>

    </header>

    <main>

    <!-- CONTATO -->
    <section class="contato-info">

        <h1>Fale Conosco</h1>

        <p><strong>Endereço:</strong> Rua das Águas Bravas, 123 - São Paulo - SP</p>
        <p><strong>Telefone:</strong> (11) 99999-9999</p>
        <p><strong>Email:</strong> contato@rioabaixorafting.com</p>

    </section>

    <div class="contato-container">

    <!-- MAPA -->
    <section class="mapa">
        <iframe
        src="https://www.google.com/maps/embed?pb=!1m18..."
        width="600"
        height="400">
        </iframe>
    </section>

    <!-- FORMULÁRIO -->
    <section class="formulario">

        <form>

            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome">
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="campo-radio">

    <p>Propósito da Mensagem</p>

    <div class="opcoes-radio">
        <label for="consulta">
    <input type="radio" id="consulta" name="finalidade" value="consulta">
    Consulta Geral
</label>

<label for="reserva">
    <input type="radio" id="reserva" name="finalidade" value="reserva">
    Pergunta sobre Reserva
</label>

<label for="sugestao">
    <input type="radio" id="sugestao" name="finalidade" value="sugestao">
    Sugestão de Site
</label>
    </div>
</div>

            <div class="campo mensagem">
      <label for="mensagem">Mensagem</label>
    <textarea id="mensagem" name="mensagem"></textarea>
</div>

            <label for="newsletter">
    <input type="checkbox" id="newsletter" name="newsletter">
    Quero receber a newsletter mensal
</label>

            <button type="submit">Entrar em Contato</button>

        </form>

    </section>

</div>

    <!-- EQUIPE -->
    <section class="equipe">

        <h2>Nossa equipe</h2>

        <div class="funcionarios">

            <figure>
                <img src="imagens/joaoo.png" alt="João Silva instrutor">
                <figcaption>João Silva - Instrutor Chefe</figcaption>
            </figure>

            <figure>
                <img src="imagens/maria.jpg" alt="Maria Souza guia">
                <figcaption>Maria Souza - Guia de Rafting</figcaption>
            </figure>

            <figure>
                <img src="imagens/carlos.jpg" alt="Carlos Lima atendimento">
                <figcaption>Carlos Lima - Atendimento ao Cliente</figcaption>
            </figure>

        </div>

    </section>

</main>

    <footer>

    <p>© 2026 Rio Abaixo Rafting</p>

    <nav class="redes-sociais">
        <a href="https://facebook.com">
            <img src="imagens/facebook.svg" alt="Facebook">
        </a>

        <a href="https://instagram.com">
            <img src="imagens/instagram.svg" alt="Instagram">
        </a>

        <a href="https://twitter.com">
            <img src="imagens/x-bw.svg" alt="Twitter">
        </a>
    </nav>

</footer>

</body>

</html>
